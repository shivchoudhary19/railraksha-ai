[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
[project]
name = "railraksha-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.128,<1", "uvicorn[standard]>=0.35,<1", "pydantic-settings>=2.10,<3", "sqlalchemy[asyncio]>=2.0.43,<3", "asyncpg>=0.30,<1", "alembic>=1.16,<2", "redis>=6.4,<8", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1", "structlog>=25.4,<26", "Pillow>=12.3,<13", "phonenumbers>=9,<10", "pyzbar==0.1.9", "python-multipart>=0.0.32,<1", "boto3>=1.43,<2"]
[project.optional-dependencies]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1.2,<2", "pytest-cov>=6,<8", "ruff>=0.13,<1", "mypy>=1.18,<2", "aiosqlite>=0.21,<1", "fakeredis[lua]>=2.31,<3", "pip-audit>=2.9,<3"]
[tool.setuptools.packages.find]
where = ["."]
include = ["railraksha*"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=railraksha --cov-report=term-missing --cov-fail-under=80"
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
